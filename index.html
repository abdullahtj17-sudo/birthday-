<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Cairo', sans-serif; overflow: hidden;
            background-color: #ffffff;
        }

        .page {
            display: none; height: 100vh; width: 100vw;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; position: absolute; top: 0; left: 0;
        }

        .active { display: flex; animation: fadeIn 1s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        img { 
            max-width: 85%; max-height: 450px; 
            border-radius: 20px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .btn {
            padding: 15px 40px; font-size: 1.2rem; cursor: pointer;
            border: none; border-radius: 50px; transition: 0.3s;
            font-weight: bold; font-family: 'Cairo', sans-serif;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .btn-blow { background-color: #ffd700; color: #333; }
        .btn-well { background-color: #ff4d6d; color: white; }
        .btn:hover { transform: scale(1.1); }

        /* الصفحة الثالثة */
        #page3 { 
            background: linear-gradient(135deg, #ff0000 0%, #8b0000 100%); 
            color: white; 
        }

        .message-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px; border-radius: 20px;
            backdrop-filter: blur(10px); max-width: 85%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: slideUp 1.5s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* تأثير القلوب */
        .heart {
            position: absolute; color: #ff4d6d;
            font-size: 20px; animation: heartFall linear forwards;
            user-select: none; z-index: 1;
        }

        @keyframes heartFall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="page1" class="page active">
        <img src="https://i.postimg.cc/q7K4GV42/IMG-8498.jpg" alt="Cake 1">
        <button class="btn btn-blow" onclick="goToPage(2)">هفهفهفففههفهفففففففففف</button>
    </div>

    <div id="page2" class="page">
        <img src="https://i.postimg.cc/JhXMQVMN/Gemini-Generated-Image-h9jlhlh9jlhlh9jl.png" alt="Cake 2">
        <button class="btn btn-well" onclick="startCelebration()">عفيهه</button>
    </div>

    <div id="page3" class="page">
        <img src="https://i.postimg.cc/mr9BSfBF/C02F6D7B-C204-4E5E-8D27-60C6BDF67036.jpg" alt="Surprise">
        <div class="message-box">
            <h2>كل عام وأنتِ بخير! 🎉</h2>
            <p>لأن اليوم هو يوم ميلادكِ، أتمنى أن تكون أيامكِ القادمة كلها جمال وسعادة تشبه نقاء روحكِ. شكراً لأنكِ موجودة في حياتي.</p>
        </div>
    </div>

    <script>
        function goToPage(num) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page' + num).classList.add('active');
        }

        function startCelebration() {
            goToPage(3);
            setInterval(createHeart, 300); // بدء تساقط القلوب
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            document.getElementById('page3').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
    </script>
</body>
</html>
